<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Модули Dr.Slon Toolkit</title>
  <desc id="desc">Двенадцать независимых модулей: доступ, индексация и обслуживание сайта. Каждый включается отдельно. Капча и кнопка входа вписываются в wp-login, старые кириллические URL можно перевести со 301.</desc>

  <rect width="1200" height="520" rx="12" fill="#f6f8fb" stroke="#d7dde7"/>
  <text x="48" y="44" fill="#167d63" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" letter-spacing="1.8">МОДУЛИ · ВКЛЮЧАЮТСЯ ПО ОДНОМУ</text>
  <text x="48" y="80" fill="#172033" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="32" font-weight="700" letter-spacing="-0.6">Один плагин, двенадцать задач</text>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="48" y="118" fill="#667085" font-size="16" font-weight="700" letter-spacing="1.2">ДОСТУП</text>

    <rect x="48" y="132" width="352" height="76" rx="8" fill="#f4fbf8" stroke="#63b69f"/>
    <rect x="66" y="154" width="28" height="28" rx="6" fill="#167d63"/>
    <text x="108" y="166" fill="#172033" font-size="20" font-weight="700">Скрытый вход</text>
    <text x="108" y="190" fill="#667085" font-size="18">404 на wp-login.php · свой slug</text>

    <rect x="48" y="220" width="352" height="76" rx="8" fill="#f4fbf8" stroke="#63b69f"/>
    <rect x="66" y="242" width="28" height="28" rx="6" fill="#167d63"/>
    <text x="108" y="254" fill="#172033" font-size="20" font-weight="700">Yandex Captcha</text>
    <text x="108" y="278" fill="#667085" font-size="18">виджет влезает в форму входа</text>

    <rect x="48" y="308" width="352" height="76" rx="8" fill="#ffffff" stroke="#d7dde7"/>
    <rect x="66" y="330" width="28" height="28" rx="6" fill="#167d63"/>
    <text x="108" y="342" fill="#172033" font-size="20" font-weight="700">Login Attempts</text>
    <text x="108" y="366" fill="#667085" font-size="18">блокировка IP, в опции хеш</text>

    <rect x="48" y="396" width="352" height="76" rx="8" fill="#ffffff" stroke="#d7dde7"/>
    <rect x="66" y="418" width="28" height="28" rx="6" fill="#167d63"/>
    <text x="108" y="430" fill="#172033" font-size="20" font-weight="700">REST API Control</text>
    <text x="108" y="454" fill="#667085" font-size="18">всем / авторизованным / whitelist</text>

    <text x="424" y="118" fill="#667085" font-size="16" font-weight="700" letter-spacing="1.2">ИНДЕКСАЦИЯ</text>

    <rect x="424" y="132" width="352" height="76" rx="8" fill="#ffffff" stroke="#d7dde7"/>
    <rect x="442" y="154" width="28" height="28" rx="6" fill="#167d63"/>
    <text x="484" y="166" fill="#172033" font-size="20" font-weight="700">AI Agents</text>
    <text x="484" y="190" fill="#667085" font-size="18">llms.txt · ai.txt · agents.md</text>

    <rect x="424" y="220" width="352" height="76" rx="8" fill="#ffffff" stroke="#d7dde7"/>
    <rect x="442" y="242" width="28" height="28" rx="6" fill="#167d63"/>
    <text x="484" y="254" fill="#172033" font-size="20" font-weight="700">IndexNow</text>
    <text x="484" y="278" fill="#667085" font-size="18">очередь WP-Cron, без файлов</text>

    <rect x="424" y="308" width="352" height="76" rx="8" fill="#ffffff" stroke="#d7dde7"/>
    <rect x="442" y="330" width="28" height="28" rx="6" fill="#167d63"/>
    <text x="484" y="342" fill="#172033" font-size="20" font-weight="700">Sitemap</text>
    <text x="484" y="366" fill="#667085" font-size="18">пагинация · TSF safe mode</text>

    <rect x="424" y="396" width="352" height="76" rx="8" fill="#ffffff" stroke="#d7dde7"/>
    <rect x="442" y="418" width="28" height="28" rx="6" fill="#167d63"/>
    <text x="484" y="430" fill="#172033" font-size="20" font-weight="700">Redirect Manager</text>
    <text x="484" y="454" fill="#667085" font-size="18">точные 301/302, не wp-admin</text>

    <text x="800" y="118" fill="#667085" font-size="16" font-weight="700" letter-spacing="1.2">САЙТ</text>

    <rect x="800" y="132" width="352" height="76" rx="8" fill="#f4fbf8" stroke="#63b69f"/>
    <rect x="818" y="154" width="28" height="28" rx="6" fill="#167d63"/>
    <text x="860" y="166" fill="#172033" font-size="20" font-weight="700">Транслитерация</text>
    <text x="860" y="190" fill="#667085" font-size="18">старые URL → латиница + 301</text>

    <rect x="800" y="220" width="352" height="76" rx="8" fill="#ffffff" stroke="#d7dde7"/>
    <rect x="818" y="242" width="28" height="28" rx="6" fill="#167d63"/>
    <text x="860" y="254" fill="#172033" font-size="20" font-weight="700">Комментарии</text>
    <text x="860" y="278" fill="#667085" font-size="18">закрыть POST, REST и UI</text>

    <rect x="800" y="308" width="352" height="76" rx="8" fill="#ffffff" stroke="#d7dde7"/>
    <rect x="818" y="330" width="28" height="28" rx="6" fill="#167d63"/>
    <text x="860" y="342" fill="#172033" font-size="20" font-weight="700">Очистка</text>
    <text x="860" y="366" fill="#667085" font-size="18">emoji, embed, XML-RPC, head</text>

    <rect x="800" y="396" width="352" height="76" rx="8" fill="#ffffff" stroke="#d7dde7"/>
    <rect x="818" y="418" width="28" height="28" rx="6" fill="#167d63"/>
    <text x="860" y="430" fill="#172033" font-size="20" font-weight="700">Update Controls</text>
    <text x="860" y="454" fill="#667085" font-size="18">ядро, плагины, темы, почта</text>
  </g>
</svg>
