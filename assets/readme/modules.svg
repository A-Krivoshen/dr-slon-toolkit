<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Модули Dr.Slon Toolkit</title>
  <desc id="desc">Девять независимых модулей: доступ, индексация и обслуживание сайта. Каждый включается отдельно.</desc>

  <rect width="1200" height="430" rx="12" fill="#f6f8fb" stroke="#d7dde7"/>
  <text x="48" y="48" fill="#167d63" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" letter-spacing="1.8">МОДУЛИ · ВКЛЮЧАЮТСЯ ПО ОДНОМУ</text>
  <text x="48" y="84" fill="#172033" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="32" font-weight="700" letter-spacing="-0.6">Один плагин, девять задач</text>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="48" y="126" fill="#667085" font-size="16" font-weight="700" letter-spacing="1.2">ДОСТУП</text>
    <rect x="48" y="140" width="352" height="72" rx="8" fill="#f4fbf8" stroke="#63b69f"/>
    <rect x="66" y="162" width="28" height="28" rx="6" fill="#167d63"/>
    <text x="108" y="174" fill="#172033" font-size="20" font-weight="700">Скрытый вход</text>
    <text x="108" y="196" fill="#667085" font-size="16">404 на wp-login.php · свой slug</text>

    <rect x="48" y="224" width="352" height="72" rx="8" fill="#ffffff" stroke="#d7dde7"/>
    <rect x="66" y="246" width="28" height="28" rx="6" fill="#167d63"/>
    <text x="108" y="258" fill="#172033" font-size="20" font-weight="700">REST API Control</text>
    <text x="108" y="280" fill="#667085" font-size="16">всем / авторизованным / whitelist</text>

    <rect x="48" y="308" width="352" height="72" rx="8" fill="#ffffff" stroke="#d7dde7"/>
    <rect x="66" y="330" width="28" height="28" rx="6" fill="#167d63"/>
    <text x="108" y="342" fill="#172033" font-size="20" font-weight="700">Комментарии</text>
    <text x="108" y="364" fill="#667085" font-size="16">закрыть POST, REST и UI</text>

    <text x="424" y="126" fill="#667085" font-size="16" font-weight="700" letter-spacing="1.2">ИНДЕКСАЦИЯ</text>
    <rect x="424" y="140" width="352" height="72" rx="8" fill="#f4fbf8" stroke="#63b69f"/>
    <rect x="442" y="162" width="28" height="28" rx="6" fill="#167d63"/>
    <text x="484" y="174" fill="#172033" font-size="20" font-weight="700">AI Agents</text>
    <text x="484" y="196" fill="#667085" font-size="16">llms.txt · ai.txt · agents.md</text>

    <rect x="424" y="224" width="352" height="72" rx="8" fill="#ffffff" stroke="#d7dde7"/>
    <rect x="442" y="246" width="28" height="28" rx="6" fill="#167d63"/>
    <text x="484" y="258" fill="#172033" font-size="20" font-weight="700">IndexNow</text>
    <text x="484" y="280" fill="#667085" font-size="16">очередь WP-Cron, без файлов</text>

    <rect x="424" y="308" width="352" height="72" rx="8" fill="#ffffff" stroke="#d7dde7"/>
    <rect x="442" y="330" width="28" height="28" rx="6" fill="#167d63"/>
    <text x="484" y="342" fill="#172033" font-size="20" font-weight="700">Sitemap</text>
    <text x="484" y="364" fill="#667085" font-size="16">пагинация · TSF safe mode</text>

    <text x="800" y="126" fill="#667085" font-size="16" font-weight="700" letter-spacing="1.2">САЙТ</text>
    <rect x="800" y="140" width="352" height="72" rx="8" fill="#ffffff" stroke="#d7dde7"/>
    <rect x="818" y="162" width="28" height="28" rx="6" fill="#167d63"/>
    <text x="860" y="174" fill="#172033" font-size="20" font-weight="700">Транслитерация</text>
    <text x="860" y="196" fill="#667085" font-size="16">русские slug, старые URL целы</text>

    <rect x="800" y="224" width="352" height="72" rx="8" fill="#ffffff" stroke="#d7dde7"/>
    <rect x="818" y="246" width="28" height="28" rx="6" fill="#167d63"/>
    <text x="860" y="258" fill="#172033" font-size="20" font-weight="700">Очистка</text>
    <text x="860" y="280" fill="#667085" font-size="16">emoji, embed, XML-RPC, head</text>

    <rect x="800" y="308" width="352" height="72" rx="8" fill="#ffffff" stroke="#d7dde7"/>
    <rect x="818" y="330" width="28" height="28" rx="6" fill="#167d63"/>
    <text x="860" y="342" fill="#172033" font-size="20" font-weight="700">Update Controls</text>
    <text x="860" y="364" fill="#667085" font-size="16">ядро, плагины, темы, почта</text>
  </g>
</svg>
